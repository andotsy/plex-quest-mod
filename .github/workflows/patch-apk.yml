name: Patch Plex APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct URL to your Plex 2026.17.0 APK, APKM, or XAPK
        required: true
        type: string
      sign_apks:
        description: Sign the complete APK set using repository signing secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test patch helpers
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Download and patch APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: python scripts/patch_apk.py --url "$APK_URL" --out dist
      - name: Sign APK install set
        if: ${{ inputs.sign_apks }}
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: python scripts/sign_apks.py --directory dist/unsigned --output dist/signed
      - name: Upload unsigned APKs and report
        if: ${{ !inputs.sign_apks }}
        uses: actions/upload-artifact@v4
        with:
          name: plex-quest-unsigned-${{ github.run_number }}
          path: |
            dist/unsigned/*.apk
            dist/patch-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed install set and report
        if: ${{ inputs.sign_apks }}
        uses: actions/upload-artifact@v4
        with:
          name: plex-quest-signed-${{ github.run_number }}
          path: |
            dist/signed/*-signed.apk
            dist/patch-report.json
          if-no-files-found: error
          retention-days: 7
