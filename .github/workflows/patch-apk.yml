name: Patch Plex APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct URL to a complete Plex 2026.17.0 APKM/XAPK or universal APK (must include ARM64 libraries)
        required: true
        type: string
      sign_apks:
        description: Sign the standalone APK for installation using repository secrets
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test patch helpers
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Download and patch APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: python scripts/patch_apk.py --url "$APK_URL" --out dist
      - name: Sign standalone APK
        if: ${{ inputs.sign_apks }}
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: python scripts/sign_apks.py --directory dist/unsigned --output dist/signed
      - name: Upload unsigned standalone APK and report
        if: ${{ !inputs.sign_apks }}
        uses: actions/upload-artifact@v7
        with:
          name: plex-quest-unsigned-${{ github.run_number }}
          path: |
            dist/unsigned/*.apk
            dist/patch-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed standalone APK and report
        if: ${{ inputs.sign_apks }}
        uses: actions/upload-artifact@v7
        with:
          name: plex-quest-signed-${{ github.run_number }}
          path: |
            dist/signed/*-signed.apk
            dist/patch-report.json
          if-no-files-found: error
          retention-days: 7
